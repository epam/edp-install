apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: edp-aggregate-view-{{ .Release.Namespace }}
  labels:
    rbac.authorization.k8s.io/aggregate-to-view: "true"
rules:
  - apiGroups:
      - v1.edp.epam.com
    resources:
      - keycloakauthflows
      - keycloakclients
      - keycloakclientscopes
      - keycloakrealmcomponents
      - keycloakrealmgroups
      - keycloakrealmidentityproviders
      - keycloakrealmrolebatches
      - keycloakrealmroles
      - keycloakrealms
      - keycloakrealmusers
      - keycloaks
      - clusterkeycloaks
      - clusterkeycloakrealms
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - v2.edp.epam.com
    resources:
      - cdpipelines
      - cdstagedeployments
      - cdstagejenkinsdeployments
      - codebasebranches
      - codebaseimagestreams
      - codebases
      - gerritgroupmembers
      - gerritgroups
      - gerritmergerequests
      - gerritprojectaccesses
      - gerritprojects
      - gerritreplicationconfigs
      - gerrits
      - gitservers
      - jiraissuemetadatas
      - jiraservers
      - quicklinks
      - stages
      - templates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - edp.epam.com
    resources:
      - sonargroups
      - sonarpermissiontemplates
      - sonars
      - sonarusers
      - sonarqualityprofiles
      - sonarqualitygates
      - nexususers
      - nexusscripts
      - nexusroles
      - nexusrepositories
      - nexuscleanuppolicies
      - nexusblobstores
      - nexuses
      - approvaltasks
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - list
      - get
      - watch
  # Gateway API (Envoy Gateway migration): read access so viewers/developers can see
  # routing objects (Gateways, HTTPRoutes) in the Portal Networking view.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gatewayclasses
      - gateways
      - httproutes
      - referencegrants
    verbs:
      - get
      - list
      - watch
  # Envoy Gateway CRDs: read access to the full resource family (proxies + policies)
  # surfaced by the Portal Networking view.
  - apiGroups:
      - gateway.envoyproxy.io
    resources:
      - backends
      - backendtrafficpolicies
      - clienttrafficpolicies
      - envoyextensionpolicies
      - envoypatchpolicies
      - envoyproxies
      - httproutefilters
      - securitypolicies
    verbs:
      - get
      - list
      - watch
