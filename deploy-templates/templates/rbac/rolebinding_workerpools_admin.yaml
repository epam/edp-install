{{- if eq (include "edp-install.agentSubstrateEnabled" .) "true" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-admin-{{ .Release.Namespace }}
  namespace: krci-agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tenant-admin-{{ .Release.Namespace }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: {{ .Values.global.adminGroupName | default (printf "%s-oidc-admins" .Release.Namespace) | quote }}
{{- end }}
