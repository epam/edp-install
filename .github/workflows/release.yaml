name: Create KRCI release
on:
  push:
    tags:
      - 'v*'

env:
    GOLANG_VERSION: '1.26'

jobs:
  prepare-release:
    name: Perform automatic release on trigger ${{ github.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The name of the tag as supplied by the GitHub event
      SOURCE_TAG: ${{ github.ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: '0'

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GOLANG_VERSION }}
          check-latest: true
          cache: false

      - name: Check if the published tag is well formed and setup vars
        run: |
          set -xue
            # refs/tags/v2.10.7 -> v2.10.7
            RELEASE_TAG="${SOURCE_TAG##*/}"

            # install git-chglog
            go install github.com/git-chglog/git-chglog/cmd/git-chglog@latest

            git-chglog --template .chglog/release.tpl.md -o release.md ${RELEASE_TAG}

            echo "RELEASE_TAG=${RELEASE_TAG}" >> $GITHUB_ENV

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: create_release
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body_path: release.md
